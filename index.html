canvas{max-width:100%}footer{text-align:center;padding:25px;color:#888}@media(max-width:650px){.wrap{padding:12px}header h1{font-size:20px}th,td{padding:6px;font-size:12px}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>THE WIN <span style="color:#ffdf57">AI</span> 彩券數據分析</h1><small>今彩539 · 香港六合彩 · 加州天天樂 ｜ 數據研究平台</small></div></header><main class="wrap"><div class="notice">本系統提供歷史統計與策略回測，不保證中獎；「AI評分」不是實際中獎機率。今彩539已匯入上傳檔案中的2026年1月至9月共237期資料；10月尚未補齊。正式環境可配置每日自動同步，未核實資料不會顯示。</div><section id="auth" class="panel"><h2>會員登入</h2><p class="muted" id="authHint">請先設定 Supabase 才能啟用真實會員登入；亦可試用本機展示模式。</p><div class="row"><input id="email" type="text" placeholder="會員電子郵件／管理員帳號 w358" autocomplete="email"><input id="password" type="password" placeholder="密碼（至少6字元）" autocomplete="current-password"><button id="signIn">登入</button><button class="secondary" id="signUp">註冊</button><button class="secondary" id="demo">展示模式</button></div><p class="muted" id="authMsg"></p></section><section id="app" class="hidden"><div class="panel row" style="justify-content:space-between"><div><b id="identity"></b> <span class="pill" id="role"></span><div class="muted" id="dataStatus"></div></div><button class="secondary" id="signOut">登出</button></div><nav id="nav"></nav><section id="view"></section></section></main><footer>THE WIN AI · 歷史數據僅供研究與教育用途</footer><div id="toast"></div><script>// 將下列兩項替換為你的 Supabase Project URL 和 anon/publishable key。
// 不可把 service_role 或 secret key 放在前端。
window.APP_CONFIG = {
  supabaseUrl: '',
  supabaseAnonKey: ''
};
</script><script>'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GAMES={tw539:{name:'今彩539',max:39,count:5,special:0},hk6:{name:'香港六合彩',max:49,count:6,special:1},ca5:{name:'加州天天樂',max:39,count:5,special:0}};
let db=null,user=null,demo=false,admin=false,game='tw539',tab='dashboard',draws=[],weights={freq:25,miss:20,trend:20,follow:20,balance:15};
const config=window.APP_CONFIG||{};const ADMIN_EMAIL='w358@thewin.local';if(config.supabaseUrl&&config.supabaseAnonKey&&window.supabase)db=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);
const notify=t=>{const el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3800)};
const key=()=>`thewin-demo-${game}`;
const VERIFIED_2026={tw539:[],hk6:[],ca5:[]};
const SOURCES={tw539:'https://lotto.ctbcbank.com/result_all.htm',hk6:'https://bet.hkjc.com/en/home',ca5:'https://www.calottery.com/en/draw-games/fantasy-5'};
function demoData(g){return VERIFIED_2026[g].map(r=>({...r,numbers:[...r.numbers]}))}
function mergedDemoData(g){const base=demoData(g);let saved=[];try{saved=JSON.parse(localStorage.getItem('thewin-demo-'+g)||'[]')}catch(e){}const map=new Map(base.map(r=>[r.draw_no,r]));if(Array.isArray(saved))saved.forEach(r=>{if(r&&r.draw_no)map.set(r.draw_no,r)});return [...map.values()]}
function parseRows(rows,g){const c=GAMES[g],seen=new Set();return rows.map(r=>{const nums=Array.isArray(r.numbers)?r.numbers:String(r.numbers||'').split(/[\s,，、;|]+/).filter(Boolean).map(Number);const sp=r.special===null||r.special===undefined||r.special===''?null:Number(r.special);const no=String(r.draw_no||'').trim(),date=String(r.draw_date||'').slice(0,10);if(!no||!/^\d{4}-\d{2}-\d{2}$/.test(date)||nums.length!==c.count||new Set(nums).size!==nums.length||nums.some(n=>!Number.isInteger(n)||n<1||n>c.max)||c.special&&(sp===null||!Number.isInteger(sp)||sp<1||sp>c.max||nums.includes(sp))||!c.special&&sp!==null)throw Error('期別 '+no+' 資料格式不正確');if(seen.has(no))throw Error('重複期別 '+no);seen.add(no);return {draw_no:no,draw_date:date,numbers:nums.sort((a,b)=>a-b),special:sp}}).sort((a,b)=>b.draw_date.localeCompare(a.draw_date)||b.draw_no.localeCompare(a.draw_no))}
async function load(){if(demo){try{const resp=await fetch('data/'+game+'.json?ts='+Date.now(),{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);VERIFIED_2026[game]=await resp.json();window.thewinSyncStatus='已連接雲端資料檔';}catch(err){window.thewinSyncStatus='無法讀取自動更新資料：'+err.message+'（請使用GitHub Pages網址，勿直接開啟本機HTML）';}draws=parseRows(mergedDemoData(game),game)}else{const {data,error}=await db.from('draws').select('draw_no,draw_date,numbers,special').eq('game',game).order('draw_date',{ascending:false}).order('draw_no',{ascending:false}).limit(2000);if(error){notify(error.message);draws=[]}else draws=parseRows(data||[],game)}$('#dataStatus').textContent=`${GAMES[game].name} · ${draws.length} 期 · ${demo?(window.thewinSyncStatus||'雲端開獎資料'):'資料庫內容'} · 最新日期：${draws[0]?.draw_date||'尚無資料'}`;render()}
function balls(nums,sp){return `<div class="balls">${nums.map(n=>`<span class="ball">${String(n).padStart(2,'0')}</span>`).join('')}${sp!=null?`<span class="ball special">${String(sp).padStart(2,'0')}</span>`:''}</div>`}
function stats(n=100){const c=GAMES[game],slice=draws.slice(0,n),freq=Array(c.max+1).fill(0),miss=Array(c.max+1).fill(slice.length),recent=Array(c.max+1).fill(0),follow=Array(c.max+1).fill(0);slice.forEach((r,i)=>r.numbers.forEach(x=>{freq[x]++;if(i<20)recent[x]++;if(miss[x]===slice.length)miss[x]=i}));for(let i=1;i<slice.length;i++){const prev=slice[i].numbers;const next=slice[i-1].numbers;if(prev.some(x=>slice[0].numbers.includes(x)))next.forEach(x=>follow[x]++)}return {freq,miss,recent,follow,used:slice.length}}
function score(s){const c=GAMES[game],a=[];for(let n=1;n<=c.max;n++){const raw=s.freq[n]/Math.max(1,s.used),missing=s.miss[n]/Math.max(1,s.used),recent=s.recent[n]/Math.max(1,Math.min(20,s.used)),follow=s.follow[n]/Math.max(1,s.used);const v=weights.freq*raw+weights.miss*missing+weights.trend*recent+weights.follow*follow+weights.balance*(1-Math.abs(n-(c.max+1)/2)/c.max);a.push({n,score:v})}return a.sort((x,y)=>y.score-x.score||x.n-y.n)}
function dashboard(){const c=GAMES[game],s=stats(),sorted=Array.from({length:c.max},(_,i)=>i+1).sort((a,b)=>s.freq[b]-s.freq[a]);return `<div class="panel"><div class="row"><label>彩種 <select id="game">${Object.entries(GAMES).map(([k,v])=>`<option value="${k}" ${k===game?'selected':''}>${v.name}</option>`).join('')}</select></label><span class="muted">正碼統計，特別號獨立顯示</span></div></div><div class="grid"><div class="panel stat"><span>資料期數</span><br><b>${draws.length}</b></div><div class="panel stat"><span>最近期別</span><br><b>${esc(draws[0]?.draw_no||'無資料')}</b></div><div class="panel stat"><span>近期熱門號碼</span><br><b>${sorted.slice(0,3).map(x=>String(x).padStart(2,'0')).join(' · ')}</b></div></div><div class="panel"><h3>最新開獎紀錄</h3><p class="muted">今彩539已匯入2026年1–9月共237期（來源：使用者提供的CSV），10月尚未補齊；其他彩種仍為部分樣本。資料來源：<a href="${SOURCES[game]}" target="_blank" rel="noopener">查看來源</a></p>${drawTable(draws.slice(0,15))}</div>`}
function drawTable(rows){return `<div class="scroll"><table><thead><tr><th>日期</th><th>期別</th><th>正碼 / 特別號</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.draw_date)}</td><td>${esc(r.draw_no)}</td><td>${balls(r.numbers,r.special)}</td></tr>`).join('')}</tbody></table></div>`}
function analysis(){const s=stats(window.currentPeriod||100),c=GAMES[game],rank=score(s),rows=Array.from({length:c.max},(_,i)=>i+1);return `<div class="panel"><h2>統計分析</h2><div class="row"><label>統計期數 <select id="period">${[10,30,50,100,500,1000].map(n=>`<option value="${n}" ${n===(window.currentPeriod||100)?'selected':''}>近${n}期</option>`).join('')}</select></label><span class="muted">實際可用 ${s.used} 期</span></div><div class="grid"><div><h3>熱門前10名</h3>${balls(rank.slice(0,10).map(x=>x.n))}</div><div><h3>最久未開前10名</h3>${balls([...rows].sort((a,b)=>s.miss[b]-s.miss[a]).slice(0,10))}</div></div><h3>各號碼明細</h3><div class="scroll"><table><thead><tr><th>號碼</th><th>出現次數</th><th>遺漏期數</th><th>近20期</th><th>模型分數</th></tr></thead><tbody>${rows.map(n=>`<tr><td>${String(n).padStart(2,'0')}</td><td>${s.freq[n]}</td><td>${s.miss[n]}</td><td>${s.recent[n]}</td><td>${score(s).find(x=>x.n===n).score.toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div>`}
function ai(){const s=stats(),rank=score(s),c=GAMES[game];return `<div class="panel"><h2>AI 統計評分與組合</h2><p class="muted">模型根據歷史統計排序；並非預測機率。請先在下方調整權重（總和100）。</p><div class="grid">${Object.entries({freq:'冷熱頻率',miss:'遺漏期數',trend:'近期走勢',follow:'相鄰期關聯',balance:'號碼分布'}).map(([k,t])=>`<label>${t}<input data-weight="${k}" type="number" min="0" max="100" value="${weights[k]}">%</label>`).join('')}</div><p id="weightTotal">總權重：${Object.values(weights).reduce((a,b)=>a+b,0)}%</p><button id="applyWeights">套用權重</button><h3>統計排序前15名</h3>${balls(rank.slice(0,15).map(x=>x.n))}<p><button id="generate">產生參考組合</button></p><div id="generated"></div></div>`}
function backtest(){return `<div class="panel"><h2>歷史回測</h2><p class="muted">逐期僅使用該期以前的資料評分；避免使用未來開獎資料。需至少30期。</p><div class="row"><label>回測最近 <input type="number" id="testN" value="30" min="5" max="300"> 期</label><button id="runTest">執行回測</button></div><div id="testResult"></div></div>`}
function calc(){return `<div class="panel"><h2>二星／三星／四星碰數計算機</h2><p class="muted">依選取顆數計算全部不重複組合。碰數＝C(n,k)，投注額＝碰數 × 每注金額。僅計算組合及成本，不預測獎金。</p><div class="row"><label>選擇號碼數（顆） <input id="chooseN" type="number" min="2" max="${GAMES[game].max}" value="5"></label><label>每注金額（元） <input id="unitCost" type="number" min="0" step="0.01" value="10"></label><button id="calcBtn">計算碰數</button></div><div id="calcResult"></div></div>`}
function adminView(){if(!admin)return `<div class="panel"><h2>管理後台登入</h2><p class="muted">管理功能需要獨立驗證帳號及密碼。展示版僅提供本機測試，不具正式安全防護。</p><form id="adminLoginForm" class="row"><input id="adminUsername" autocomplete="username" placeholder="管理員帳號" required><input id="adminPassword" type="password" autocomplete="current-password" placeholder="管理員密碼" required><button type="submit">登入管理後台</button></form><p class="danger" id="adminLoginError" aria-live="polite"></p></div>`;return `<div class="panel"><h2>管理員後台</h2><p class="muted">匯入目前選擇彩種的 JSON 或 CSV 開獎資料。匯入時會驗證期別、日期、號碼數量及重複號碼。</p><label>匯入檔案 <input type="file" id="importFile" accept=".json,.csv,application/json,text/csv"></label><p><button id="importBtn">驗證並匯入</button> <button class="secondary" id="exportBtn">匯出目前資料 CSV</button></p><p class="notice">CSV 欄位：draw_no,draw_date,numbers,special；numbers 用空格分隔。真實模式需具備資料庫 admin 權限。</p><h3>公告管理</h3><textarea id="announcement" placeholder="輸入公告內容"></textarea><button id="saveNotice">儲存公告</button></div>`}
function render(){const tabs=[['dashboard','首頁'],['analysis','統計分析'],['ai','AI選號'],['backtest','歷史回測'],['calc','碰數計算'],['admin','管理後台']];$('#nav').innerHTML=tabs.map(([id,t])=>`<button data-tab="${id}" class="${id===tab?'active':''}">${t}</button>`).join('');$('#view').innerHTML=({dashboard,analysis,ai,backtest,calc,admin:adminView}[tab])();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if($('#game'))$('#game').onchange=e=>{game=e.target.value;load()};if($('#period'))$('#period').onchange=e=>{window.currentPeriod=Number(e.target.value);$('#view').innerHTML=analysisPeriod(window.currentPeriod);$('#period').onchange=ev=>{window.currentPeriod=Number(ev.target.value);$('#view').innerHTML=analysisPeriod(window.currentPeriod)}};if($('#applyWeights'))$('#applyWeights').onclick=applyWeights;if($('#generate'))$('#generate').onclick=generate;if($('#runTest'))$('#runTest').onclick=runTest;if($('#calcBtn')){ $('#calcBtn').onclick=calculate;calculate(); }if($('#adminLoginForm'))$('#adminLoginForm').onsubmit=adminLogin; if($('#importBtn'))$('#importBtn').onclick=importFile;if($('#exportBtn'))$('#exportBtn').onclick=exportCsv;if($('#saveNotice'))$('#saveNotice').onclick=saveNotice;if($('#announcement'))$('#announcement').value=localStorage.getItem('thewin-announcement')||''}
function analysisPeriod(n){const original=stats;const s=stats(n),c=GAMES[game],rank=score(s);return `<div class="panel"><h2>統計分析</h2><div class="row"><label>統計期數 <select id="period">${[10,30,50,100,500,1000].map(v=>`<option value="${v}" ${v===n?'selected':''}>近${v}期</option>`).join('')}</select></label>實際 ${s.used} 期</div><h3>熱門前10名</h3>${balls([...Array(c.max)].map((_,i)=>i+1).sort((a,b)=>s.freq[b]-s.freq[a]).slice(0,10))}<h3>最久未開前10名</h3>${balls([...Array(c.max)].map((_,i)=>i+1).sort((a,b)=>s.miss[b]-s.miss[a]).slice(0,10))}<div class="scroll"><table><tr><th>號碼</th><th>頻率</th><th>遺漏</th><th>近20期</th><th>模型分數</th></tr>${Array.from({length:c.max},(_,i)=>i+1).map(x=>`<tr><td>${x}</td><td>${s.freq[x]}</td><td>${s.miss[x]}</td><td>${s.recent[x]}</td><td>${rank.find(y=>y.n===x).score.toFixed(2)}</td></tr>`).join('')}</table></div></div>`}
function applyWeights(){const vals={};document.querySelectorAll('[data-weight]').forEach(el=>vals[el.dataset.weight]=Number(el.value));if(Object.values(vals).some(v=>!Number.isFinite(v)||v<0||v>100)||Object.values(vals).reduce((a,b)=>a+b,0)!==100)return notify('權重必須介於0–100且總和為100');weights=vals;render();notify('權重已套用')}
function generate(){const rank=score(stats()),c=GAMES[game];const result=rank.slice(0,c.count).map(x=>x.n).sort((a,b)=>a-b);$('#generated').innerHTML=`<h3>模型參考組合</h3>${balls(result)}<p class="muted">僅依歷史分數排序，非必中號碼。</p>`}
function runTest(){const N=Math.min(300,Math.max(5,Number($('#testN').value)||30));if(draws.length<N+20)return notify('資料不足，至少需要回測期數+20期');let hits=Array(GAMES[game].count+1).fill(0),total=0;for(let i=N-1;i>=0;i--){const history=draws.slice(i+1),s=statsFrom(history,100),pick=score(s).slice(0,GAMES[game].count).map(x=>x.n),h=draws[i].numbers.filter(x=>pick.includes(x)).length;hits[h]++;total+=h}const expected=N*GAMES[game].count*GAMES[game].count/GAMES[game].max;$('#testResult').innerHTML=`<h3>回測結果</h3><p>回測 ${N} 期，累計命中正碼 <b>${total}</b> 個，平均每期 ${(total/N).toFixed(2)} 個。</p><p>隨機基準的期望累計命中約 <b>${expected.toFixed(1)}</b> 個（非實際隨機抽樣）。</p><div class="scroll"><table><tr><th>每期命中數</th><th>期數</th></tr>${hits.map((v,i)=>`<tr><td>${i}</td><td>${v}</td></tr>`).join('')}</table></div><p class="muted">僅測試目前加權策略，未計入交易成本、獎金或多重測試偏差。</p>`}
function statsFrom(rows,n){const c=GAMES[game],slice=rows.slice(0,n),freq=Array(c.max+1).fill(0),miss=Array(c.max+1).fill(slice.length),recent=Array(c.max+1).fill(0),follow=Array(c.max+1).fill(0);slice.forEach((r,i)=>r.numbers.forEach(x=>{freq[x]++;if(i<20)recent[x]++;if(miss[x]===slice.length)miss[x]=i}));for(let i=1;i<slice.length;i++)if(slice[i].numbers.some(x=>slice[0].numbers.includes(x)))slice[i-1].numbers.forEach(x=>follow[x]++);return {freq,miss,recent,follow,used:slice.length}}
function combination(n,k){if(n<k)return 0;let v=1;for(let i=1;i<=k;i++)v=v*(n-i+1)/i;return Math.round(v)}
function calculate(){const n=Number($('#chooseN').value),cost=Number($('#unitCost').value),max=GAMES[game].max;if(!Number.isInteger(n)||n<2||n>max||cost<0||!Number.isFinite(cost))return notify('請輸入2至'+max+'顆號碼及有效金額');let sum=0;const rows=[2,3,4].map(k=>{const count=combination(n,k),amount=Math.round(count*cost*100)/100;sum+=amount;return `<tr><td>${['','', '二星','三星','四星'][k]}</td><td>C(${n},${k})</td><td><b>${count.toLocaleString('zh-TW')}</b> 碰</td><td>${cost.toLocaleString('zh-TW')}</td><td><b>${amount.toLocaleString('zh-TW')}</b> 元</td></tr>`}).join('');$('#calcResult').innerHTML=`<div class="scroll"><table><thead><tr><th>玩法</th><th>計算式</th><th>碰數</th><th>每注金額</th><th>總投注額</th></tr></thead><tbody>${rows}</tbody></table></div><p class="stat">二星＋三星＋四星合計：<b>${sum.toLocaleString('zh-TW')} 元</b></p>`}
function csvParse(text){const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);const cols=lines.shift().split(',').map(s=>s.trim());if(!['draw_no','draw_date','numbers'].every(x=>cols.includes(x)))throw Error('CSV 缺少必要欄位');return lines.filter(Boolean).map(l=>{const a=l.split(',');return Object.fromEntries(cols.map((k,i)=>[k,a[i]||'']))})}
async function importFile(){if(!admin)return notify('請先登入管理後台');const f=$('#importFile').files[0];if(!f)return notify('請選擇檔案');try{const raw=await f.text();const rows=parseRows(f.name.toLowerCase().endsWith('.json')?JSON.parse(raw):csvParse(raw),game);if(!Array.isArray(rows)||!rows.length)throw Error('檔案沒有資料');if(demo){const existing=mergedDemoData(game);const map=new Map(existing.map(r=>[r.draw_no,r]));rows.forEach(r=>map.set(r.draw_no,r));localStorage.setItem(key(),JSON.stringify([...map.values()]));notify(`已匯入 ${rows.length} 期至本機展示資料`)}else{const payload=rows.map(r=>({...r,game}));const {error}=await db.from('draws').upsert(payload,{onConflict:'game,draw_no'});if(error)throw error;notify(`已匯入 ${rows.length} 期`)}await load()}catch(e){notify('匯入失敗：'+e.message)}}
function exportCsv(){const content='draw_no,draw_date,numbers,special\n'+draws.map(r=>[r.draw_no,r.draw_date,r.numbers.join(' '),r.special??''].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8'}));a.download=`${game}-draws.csv`;a.click();URL.revokeObjectURL(a.href)}
function saveNotice(){localStorage.setItem('thewin-announcement',$('#announcement').value);notify('公告已儲存在目前瀏覽器（未同步至會員）')}
async function login(){if(!db)return notify('請先設定 config.js 的 Supabase 連線');const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim().toLowerCase()==='w358'?ADMIN_EMAIL:$('#email').value,password:$('#password').value});if(error)notify(error.message)}
async function signup(){if(!db)return notify('請先設定 Supabase');const {error}=await db.auth.signUp({email:$('#email').value,password:$('#password').value});notify(error?error.message:'註冊已提交；如啟用郵件驗證，請至信箱確認')}
async function start(u,isDemo){user=u;demo=isDemo;admin=false;if(!isDemo){const {data,error}=await db.from('profiles').select('role').eq('id',u.id).single();if(error)notify('無法讀取角色：'+error.message);admin=data?.role==='admin'}$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#identity').textContent=isDemo?'展示訪客':(u.email===ADMIN_EMAIL?'w358':u.email);$('#role').textContent=isDemo?'展示訪客':admin?'管理員':'會員';await load()}
function adminLogin(e){e.preventDefault();const name=$('#adminUsername').value.trim();const pass=$('#adminPassword').value;if(!demo){$('#adminLoginError').textContent='正式模式請先以 Supabase 管理員帳號登入。';return}if(name==='w358'&&pass==='Aaaa8888'){admin=true;$('#role').textContent='展示管理員';render();notify('已進入展示管理後台')}else{$('#adminPassword').value='';$('#adminLoginError').textContent='管理員帳號或密碼錯誤'}}
async function logout(){if(!demo&&db)await db.auth.signOut();user=null;demo=false;admin=false;$('#app').classList.add('hidden');$('#auth').classList.remove('hidden')}
$('#signIn').onclick=login;$('#signUp').onclick=signup;$('#demo').onclick=()=>start({email:'demo'},true);$('#signOut').onclick=logout;if(db){db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user&&!user)start(session.user,false);if(event==='SIGNED_OUT'&&!demo)logout()});db.auth.getSession().then(({data})=>{if(data.session?.user&&!user)start(data.session.user,false)})}else $('#authHint').textContent='目前未設定 Supabase；可先使用「展示模式」。展示模式已內建今彩539 2026年1–9月237期資料，10月尚未補齊。';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
